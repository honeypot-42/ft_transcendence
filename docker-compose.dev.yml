# docker-compose.dev.yml
#
# Development stack. Everything goes through Nginx over HTTPS:
#   https://localhost            → frontend (Vite, hot reload)
#   https://localhost/api/...    → backend (NestJS, watch mode)
#   wss://localhost/socket.io/   → backend (Socket.IO)
#
# Only Nginx publishes ports. Other services are reached with
# `docker compose -f docker-compose.dev.yml exec <service> ...`.
# Not included in development: Kibana, Cowrie, Prometheus, Grafana.
# The simulator replaces Cowrie: simulator → log volume → Logstash → Elasticsearch.
#
# Usage:
#   cp .env.example .env            # and fill in the secrets
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml down
#   docker compose -f docker-compose.dev.yml down -v   # also removes volumes

name: sentinel-dev

# ─── Networks ────────────────────────────────────────────────────────────────
# Each service joins only the networks it needs.
networks:
  edge_net:   # nginx ↔ frontend, backend
  app_net:    # backend ↔ postgres
  data_net:   # backend, logstash, elk-setup ↔ elasticsearch

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  elasticsearch_data:
  logstash_data:    # sincedb: how far Logstash has read each log file
  honeypot_logs:    # simulator writes, logstash reads (read-only)
  nginx_certs:      # self-signed certificate, generated on first start

# ─── Services ────────────────────────────────────────────────────────────────
services:

  # ---------------------------------------------------------------------------
  # Nginx — single entry point (HTTPS). Owner: P2
  # The only service of the application that publishes ports on the host.
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: sentinel-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"      # only redirects to HTTPS
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - nginx_certs:/etc/nginx/ssl
    networks:
      - edge_net
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 64m

  # ---------------------------------------------------------------------------
  # Frontend — React 18 + Vite (HMR through Nginx). Owner: P1
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Same origin as the page: relative paths, never http://localhost:3001
      - VITE_API_URL=/api/v1
      - VITE_WS_PATH=/socket.io
    networks:
      - edge_net
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Backend — NestJS (watch mode). Owner: P2
  # Internal port only: https://localhost/api/v1/... and /api/docs via Nginx.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      # Built here from POSTGRES_*, so inside Docker it can never drift from
      # the database credentials. It takes precedence over the value in .env.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # Read-only user created by elk-setup (role sentinel_reader), never `elastic`
      - ELASTICSEARCH_USER=${BACKEND_ES_USER}
      - ELASTICSEARCH_PASSWORD=${BACKEND_ES_PASSWORD}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
    networks:
      - edge_net
      - app_net
      - data_net
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      elk-setup:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Database — PostgreSQL 16. Owner: P5
  # Stores: users, friendships, messages, notifications, api_keys
  # Not published on the host: exec postgres psql -U <user> <db>
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      # $$ → the variables are read inside the container when the check runs
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------------------------------------------------------------------
  # Search & Analytics — Elasticsearch 8. Owner: P3
  # Stores: attack events from honeypots (indexed by Logstash)
  # Not published on the host: exec elasticsearch curl localhost:9200/...
  # Security enabled in every environment. Plain HTTP only inside data_net:
  # TLS ends at Nginx and Elasticsearch is never reachable from outside.
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: sentinel-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - cluster.name=sentinel-dev
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      # Password of the `elastic` superuser: used only by elk-setup and the healthcheck
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - data_net
    healthcheck:
      # Single node: a replica can never be assigned, so an index with replicas
      # stays "yellow" forever. Waiting for "green" would block the stack.
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1536m

  # ---------------------------------------------------------------------------
  # ELK setup — one-shot: ILM, templates, least-privilege roles and users. Owner: P3
  # Runs after Elasticsearch is healthy and exits; see elk/elasticsearch/setup.sh
  # ---------------------------------------------------------------------------
  elk-setup:
    image: curlimages/curl:8.10.1
    container_name: sentinel-elk-setup
    restart: "no"
    entrypoint: ["/bin/sh", "/setup/setup.sh"]
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - LOGSTASH_ES_USER=${LOGSTASH_ES_USER}
      - LOGSTASH_ES_PASSWORD=${LOGSTASH_ES_PASSWORD}
      - BACKEND_ES_USER=${BACKEND_ES_USER}
      - BACKEND_ES_PASSWORD=${BACKEND_ES_PASSWORD}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-}
    volumes:
      - ./elk/elasticsearch:/setup:ro
    networks:
      - data_net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Logstash — honeypot pipeline: Cowrie JSON → ECS + GeoIP → Elasticsearch. Owner: P3
  # Reads the honeypot logs from a read-only volume: the only link between the
  # honeypots and the rest of the system is a file.
  # ---------------------------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: sentinel-logstash
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx512m
      - LOGSTASH_ES_USER=${LOGSTASH_ES_USER}
      - LOGSTASH_ES_PASSWORD=${LOGSTASH_ES_PASSWORD}
      - XPACK_MONITORING_ENABLED=false
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/mappings:/usr/share/logstash/mappings:ro
      - honeypot_logs:/var/log/honeypot:ro
      - logstash_data:/usr/share/logstash/data
    networks:
      - data_net
    depends_on:
      elk-setup:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g

  # ---------------------------------------------------------------------------
  # Attack Simulator — generates realistic honeypot logs for development
  # Replaces real honeypots during S1-S8. Real honeypots take over in S9 (VPS).
  # Owner: P4 (Check simulator/README.md)
  # ---------------------------------------------------------------------------
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: sentinel-simulator
    restart: on-failure:3
    network_mode: none
    read_only: true
    environment:
      - SIMULATOR_MODE=${SIMULATOR_MODE:-basic}
      - SIMULATOR_RATE=${SIMULATOR_RATE:-}
    volumes:
      - honeypot_logs:/var/log/honeypot
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

# ─── RAM Summary (development) ───────────────────────────────────────────────
# nginx:             64 MB
# frontend:         512 MB
# backend:          512 MB
# postgres:         256 MB
# elasticsearch:   1536 MB  (heap 512MB-1GB + JVM overhead)
# logstash:        1024 MB  (heap 256-512MB + JVM overhead)
# simulator:        128 MB
# Docker overhead:  ~200 MB
# ─────────────────────────────
# TOTAL:           ~4.2 GB    OK on any machine with 8 GB RAM
