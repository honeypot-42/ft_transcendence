# Honeypot pipeline — Cowrie JSON log (real Cowrie or the simulator) → ECS → Elasticsearch
# Owner: P3. Starter version: extend with more Cowrie fields as needed.

input {
  file {
    # cowrie.json and its rotated copy cowrie.json.1 (rotation by rename keeps
    # the inode, so sincedb does not read the same lines twice)
    path           => "/var/log/honeypot/cowrie.json*"
    codec          => json
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/sincedb-cowrie"
    tags           => ["honeypot"]
  }
}

filter {
  if "honeypot" in [tags] {
    date { match => ["timestamp", "ISO8601"] target => "@timestamp" }

    mutate {
      rename => {
        "src_ip"   => "[source][ip]"
        "eventid"  => "[event][action]"
        "session"  => "[honeypot][session]"
        "username" => "[credentials][username]"
        "password" => "[credentials][password]"
        "input"    => "command"
        "shasum"   => "file_hash"
      }
      add_field => {
        "[honeypot][type]"    => "cowrie"
        "[network][protocol]" => "ssh"
      }
    }
    if [protocol] == "telnet" { mutate { replace => { "[network][protocol]" => "telnet" } } }

    # Stable unique id, used by the backend as a cursor (search_after)
    fingerprint {
      source              => ["[honeypot][session]", "timestamp", "[event][action]", "[source][ip]"]
      concatenate_sources => true
      method              => "SHA256"
      target              => "[event][id]"
    }

    # GeoIP with the database bundled with Logstash (no MaxMind licence key needed)
    geoip {
      source            => "[source][ip]"
      target            => "[source]"
      ecs_compatibility => v8
    }

    # MITRE ATT&CK technique and severity by rules (see mappings/)
    translate {
      source          => "[event][action]"
      target          => "[threat][technique][id]"
      dictionary_path => "/usr/share/logstash/mappings/mitre.yml"
      fallback        => "unknown"
    }
    translate {
      source          => "[event][action]"
      target          => "severity"
      dictionary_path => "/usr/share/logstash/mappings/severity.yml"
      fallback        => "low"
    }

    # [event][original] is the raw line kept by the json codec: it would store
    # every captured credential twice (data minimisation, GDPR)
    mutate { remove_field => ["timestamp", "message", "log", "host", "sensor", "src_port", "dst_ip", "dst_port", "protocol", "[event][original]"] }
  }
}

output {
  if "honeypot" in [tags] {
    # Writes to the data stream logs-honeypot-default (template logs-honeypot)
    elasticsearch {
      hosts                 => ["http://elasticsearch:9200"]
      user                  => "${LOGSTASH_ES_USER}"
      password              => "${LOGSTASH_ES_PASSWORD}"
      data_stream           => "true"
      data_stream_type      => "logs"
      data_stream_dataset   => "honeypot"
      data_stream_namespace => "default"
    }
  }
}
