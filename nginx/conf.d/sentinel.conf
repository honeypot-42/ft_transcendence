# Docker's internal DNS. Using variables in proxy_pass makes Nginx resolve the
# upstreams at request time, so it starts even if a service (e.g. Kibana in
# development) is not running. That request gets a 502 instead.
resolver 127.0.0.11 valid=10s ipv6=off;

# ─── HTTP → HTTPS ────────────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name _;
  return 301 https://$host$request_uri;
}

# ─── HTTPS ───────────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # Security headers. "always" also adds them to error responses (4xx/5xx).
  # They are inherited only by locations without their own add_header.
  # HSTS is added only in production, with a valid certificate.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  set $frontend http://frontend:3000;
  set $backend  http://backend:3001;
  set $kibana   http://kibana:5601;

  # Health endpoint for the container healthcheck
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Login: 5 requests/min per IP. burst=4 lets 5 in at once and the 6th gets a 429.
  location = /api/v1/auth/login {
    limit_req zone=login burst=4 nodelay;
    proxy_pass $backend;
    include /etc/nginx/conf.d/proxy_headers.inc;
  }

  # REST API (NestJS global prefix /api/v1) and Swagger (/api/docs)
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass $backend;
    include /etc/nginx/conf.d/proxy_headers.inc;
  }

  # Socket.IO (WebSocket upgrade). Long timeout so idle sockets stay open.
  location /socket.io/ {
    proxy_pass $backend;
    include /etc/nginx/conf.d/proxy_headers.inc;
    proxy_read_timeout 1h;
  }

  # Kibana (server.basePath=/kibana, server.rewriteBasePath=true). Login required.
  location /kibana/ {
    proxy_pass $kibana;
    include /etc/nginx/conf.d/proxy_headers.inc;
  }

  # Frontend (Vite dev server in development, static build in evaluation)
  location / {
    proxy_pass $frontend;
    include /etc/nginx/conf.d/proxy_headers.inc;
  }
}
