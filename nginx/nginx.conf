user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # JSON access log, ready to be shipped to Logstash (logs-app).
  # In the official image /var/log/nginx/access.log is a link to stdout.
  log_format json escape=json '{'
    '"@timestamp":"$time_iso8601",'
    '"client_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration":$request_time,'
    '"user_agent":"$http_user_agent"'
  '}';
  access_log /var/log/nginx/access.log json;

  sendfile             on;
  keepalive_timeout    65;
  server_tokens        off;   # hide the Nginx version in headers and error pages
  client_max_body_size 5m;

  # Rate limiting per client IP. The backend adds per-API-key limits on top.
  #   api:   20 requests/s, for the whole REST API
  #   login: 5 requests/min, against password brute force
  limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_status 429;

  # WebSocket upgrade: forward "Connection: upgrade" only when the client asks for it
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  include /etc/nginx/conf.d/*.conf;
}
